<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MovieHub Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Watch latest movies online free on MovieHub Pro">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
}

header {
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:red;
  background:#111;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
  padding:20px;
}

.card {
  background:#111;
  border-radius:12px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover { transform:scale(1.05); }

.card img {
  width:100%;
  height:220px;
  object-fit:cover;
}

.card p {
  text-align:center;
  margin:10px 0;
}

.btn {
  display:block;
  text-align:center;
  padding:8px;
  background:red;
  color:white;
  text-decoration:none;
  font-size:13px;
}
</style>
</head>

<body>

<header>🎬 MovieHub Pro</header>

<div class="grid" id="movies">

  <div class="card">
    <img src="https://via.placeholder.com/200x300">
    <p>Sample Movie</p>
    <a class="btn" href="#">▶ Watch</a>
  </div>

</div>

</body>
</html>
