<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MovieHub</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

  <header class="flex items-center justify-between px-6 py-4 border-b border-gray-800">
    <h1 class="text-3xl font-bold text-red-600">MovieHub</h1>

    <nav class="flex gap-6 text-gray-300">
      <a href="#">Home</a>
      <a href="#">Trending</a>
      <a href="#">Web Series</a>
    </nav>
  </header>

  <section class="h-screen flex flex-col items-center justify-center text-center px-6">
    <h2 class="text-5xl md:text-7xl font-extrabold mb-6">
      Watch Trending Movies
    </h2>

    <p class="text-gray-400 max-w-2xl text-lg mb-8">
      Discover the latest action, thriller, anime and OTT releases in one place.
    </p>

    <button class="bg-red-600 hover:bg-red-700 px-8 py-4 rounded-2xl text-lg font-bold">
      Explore Now
    </button>
  </section>

  <section class="px-6 py-16">
    <h3 class="text-4xl font-bold mb-10">Trending Movies</h3>

    <div class="grid md:grid-cols-3 gap-8">

      <div class="bg-gray-900 rounded-3xl overflow-hidden">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop"
             class="w-full h-80 object-cover">

        <div class="p-6">
          <h4 class="text-2xl font-bold mb-3">Dark City</h4>
          <button class="w-full bg-red-600 py-3 rounded-xl font-bold">
            Watch Details
          </button>
        </div>
      </div>

      <div class="bg-gray-900 rounded-3xl overflow-hidden">
        <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200&auto=format&fit=crop"
             class="w-full h-80 object-cover">

        <div class="p-6">
          <h4 class="text-2xl font-bold mb-3">Silent Night</h4>
          <button class="w-full bg-red-600 py-3 rounded-xl font-bold">
            Watch Details
          </button>
        </div>
      </div>

      <div class="bg-gray-900 rounded-3xl overflow-hidden">
        <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=1200&auto=format&fit=crop"
             class="w-full h-80 object-cover">

        <div class="p-6">
          <h4 class="text-2xl font-bold mb-3">The Last Hero</h4>
          <button class="w-full bg-red-600 py-3 rounded-xl font-bold">
            Watch Details
          </button>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
