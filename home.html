<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MovieHub Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Watch latest movies online free on MovieHub Pro">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
}

header {
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:red;
  background:#111;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
  padding:20px;
}

.card {
  background:#111;
  border-radius:12px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover { transform:scale(1.05); }

.card img {
  width:100%;
  height:220px;
  object-fit:cover;
}

.card p {
  text-align:center;
  margin:10px 0;
}

.btn {
  display:block;
  text-align:center;
  padding:8px;
  background:red;
  color:white;
  text-decoration:none;
  font-size:13px;
}
</style>
</head>

<body>

<header>🎬 MovieHub Pro</header>

<!-- MOVIES GRID -->
<div id="movies" class="grid"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC8f_JdIWEb-2fAKZ-EBlpIJ64WWFKve-8",
  authDomain: "home-91bcd.firebaseapp.com",
  databaseURL: "https://home-91bcd-default-rtdb.firebaseio.com",
  projectId: "home-91bcd",
  storageBucket: "home-91bcd.firebasestorage.app",
  messagingSenderId: "475106706056",
  appId: "1:475106706056:web:6b1e9461ea8c6e2af5553d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* SHOW MOVIES */
db.ref("movies").on("value", (snapshot) => {
  let data = snapshot.val();
  let html = "";

  for (let key in data) {
    html += `
      <div class="card">
        <img src="${data[key].image}">
        <p>${data[key].title}</p>
        <a class="btn">▶ Watch</a>
      </div>
    `;
  }

  document.getElementById("movies").innerHTML = html;
});
</script>

</body>
</html>
