<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieHub Pro</title>
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#000;
      color:#fff;
    }

    header{
      padding:20px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
      background:#111;
      border-bottom:1px solid #333;
    }

    .container{
      padding:20px;
      max-width:900px;
      margin:auto;
    }

    .input-row{
      display:flex;
      gap:10px;
      margin-bottom:20px;
    }

    input{
      flex:1;
      padding:10px;
      border:none;
      border-radius:6px;
    }

    button{
      padding:10px 15px;
      background:red;
      color:#fff;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    .movie{
      background:#111;
      padding:15px;
      margin-bottom:15px;
      border-radius:10px;
    }

    .movie h3{
      margin:0 0 10px 0;
    }

    .reviews{
      margin-top:10px;
      font-size:14px;
      color:#ccc;
    }

    .review-box{
      display:flex;
      gap:10px;
      margin-top:10px;
    }
  </style>
</hea
